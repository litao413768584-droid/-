[package]
name = "cangrong-calculator"
version = "0.1.0"
description = "舱容计算与PDF解析系统"
authors = ["Your Name <email@example.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "cangrong_calculator_lib"
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = ["api-all"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"